<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A1 TECH — Quotation &amp; Invoice Generator</title>
<link id="favicon" rel="icon" type="image/png" href="">
<link id="favicon-shortcut" rel="shortcut icon" type="image/png" href="">
<link rel="favicon" href="assets/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style id="appStyles">
:root{
  --ink:#1B3A5C; --ink-2:#15304E; --ink-3:#0D2440;
  --paper:#FFFFFF; --bg:#F5F7FA;
  --accent:#0A6ED1; --accent-2:#2B99FF; --accent-ink:#0854A0;
  --steel:#0A6ED1; --good:#1A7A4C; --bad:#BB2E24;
  --line:#DCE6F0; --line-2:#C4D7E8;
  --text:#1B2A3A; --muted:#5A7893; --muted-2:#8AA3B8;
  --sidebar-w:256px;
  --radius:10px;
  --shadow:0 1px 2px rgba(27,58,92,.06), 0 10px 28px -14px rgba(27,58,92,.22);
  --shadow-lg:0 4px 10px rgba(27,58,92,.10), 0 24px 48px -20px rgba(27,58,92,.35);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
}
:root:not([data-theme="light"]){ }
*{box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-.01em;}
button,input,select,textarea{font-family:inherit;font-size:14px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c7cdcb;border-radius:8px;}
a{color:inherit;}

/* ---- Shell ---- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:linear-gradient(200deg,var(--ink) 0%,var(--ink-2) 60%,var(--ink-3) 100%);
  color:#C9D6E4;display:flex;flex-direction:column;position:fixed;left:0;top:0;height:100vh;z-index:20;
  padding-top:env(safe-area-inset-top,0px);box-shadow:2px 0 18px -6px rgba(13,36,64,.35);
}
.brand{display:flex;align-items:center;gap:12px;padding:22px 22px 19px;border-bottom:1px solid rgba(255,255,255,.10);}
.brand-mark{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.18), 0 6px 16px -4px rgba(0,0,0,.5);}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-name{font-family:'Space Grotesk';font-weight:700;font-size:15.5px;color:#fff;line-height:1.2;letter-spacing:-.01em;}
.brand-sub{font-size:10px;color:var(--accent-2);letter-spacing:.1em;font-weight:600;text-transform:uppercase;margin-top:2px;}
nav.nav{padding:18px 12px;display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.nav-section-lbl{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:10px 13px 6px;}
.nav-btn{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:8px;background:transparent;border:none;border-left:3px solid transparent;color:#B7C6D8;text-align:left;cursor:pointer;font-size:13.5px;font-weight:500;transition:background .15s,color .15s,border-color .15s;}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-btn.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600;border-left-color:var(--accent-2);}
.nav-btn.active .nav-ic{color:var(--accent-2);}
.nav-ic{width:18px;text-align:center;flex:none;font-size:14px;}
.nav-divider{height:1px;background:rgba(255,255,255,.10);margin:12px 8px;}
.sidebar-foot{padding:16px 20px 20px;border-top:1px solid rgba(255,255,255,.10);font-size:11px;color:var(--muted-2);}
.save-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#9FB4C9;}
.save-dot{width:6px;height:6px;border-radius:50%;background:#9FB4C9;}
.save-pill.ok .save-dot{background:#4FCE93;}
.save-pill.busy .save-dot{background:var(--accent-2);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.main{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:var(--sidebar-w);height:100vh;overflow:hidden;}
.topbar{flex:none;z-index:10;background:rgba(245,247,250,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));}
.topbar h1{font-size:19.5px;letter-spacing:-.015em;}
.topbar .crumb{font-size:12px;color:var(--muted);margin-top:3px;font-weight:500;}
.hamburger{display:none;background:var(--paper);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer;}
.view{padding:26px 30px 64px;max-width:none;width:100%;flex:1;overflow-y:auto;}

/* ---- Buttons / inputs ---- */
.btn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--text);padding:9px 15px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 1px 1px rgba(15,27,42,.02);}
.btn:hover{border-color:#c7ced2;background:#fbfbfb;transform:translateY(-1px);box-shadow:0 4px 10px -4px rgba(15,27,42,.15);}
.btn-primary{background:#fff;border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgba(59,130,199,.18);}
.btn-primary:hover{background:#F0F8FF;border-color:var(--ink);}
.btn-accent{background:#fff;border:1.5px solid var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgba(59,130,199,.18);}
.btn-accent:hover{background:#EAF3FB;border-color:var(--ink-3);}
.btn-danger{color:var(--bad);border-color:#f0cdc5;background:#fff;}
.btn-danger:hover{background:#fdefec;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn-ghost{border-color:transparent;background:transparent;box-shadow:none;}
.btn-ghost:hover{background:#e8ebec;transform:none;box-shadow:none;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 5px;text-transform:none;}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,132,46,.14);}
textarea{resize:vertical;min-height:64px;}
.field{margin-bottom:13px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:22px;}
.section-title{font-size:12px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.07em;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.section-title .n{color:var(--accent);}

/* ---- Dashboard ---- */
.hero-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
.hero-card{border-radius:18px;padding:30px;cursor:pointer;border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;box-shadow:var(--shadow-lg);}
.hero-card:hover{transform:translateY(-3px);}
.hero-card.quote{background:linear-gradient(135deg,var(--ink),var(--accent));color:#fff;}
.hero-card.invoice{background:linear-gradient(135deg,var(--ink-3),var(--accent-2));color:#fff;}
.hero-card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.14),transparent 55%);pointer-events:none;}
.hero-card .hc-tag{font-size:10.5px;letter-spacing:.1em;opacity:.8;font-weight:700;text-transform:uppercase;}
.hero-card h2{font-size:27px;margin:10px 0 6px;font-weight:700;}
.hero-card p{margin:0;font-size:13px;opacity:.85;max-width:80%;line-height:1.5;}
.hero-card .hc-ic{position:absolute;right:20px;top:20px;font-size:40px;opacity:.18;}
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px;}
.stat{padding:17px 19px;}
.stat .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.stat .val{font-family:'Space Grotesk';font-size:23px;font-weight:700;margin-top:7px;letter-spacing:-.01em;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFB;}
td{padding:12px 14px;border-bottom:1px solid #EFF1F1;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s;}
tbody tr:hover{background:#F8F9F9;}
.badge{display:inline-block;padding:3.5px 10px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.02em;}
.badge.draft{background:#F3ECDD;color:#8A6A2A;}
.badge.generated{background:#DFEFE7;color:var(--good);}
.tbl-actions{display:flex;gap:6px;}
.icon-btn{width:29px;height:29px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:.15s;}
.icon-btn:hover{background:#f0f1f1;color:var(--text);border-color:#ccd2d4;}
.empty{padding:48px 20px;text-align:center;color:var(--muted);}
.empty .e-ic{font-size:30px;margin-bottom:10px;}

/* ---- List toolbar ---- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.toolbar input[type=text]{max-width:280px;}
.toolbar select{max-width:160px;}
.spacer{flex:1;}

/* ---- Editor ---- */
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
.editor-form{display:flex;flex-direction:column;gap:16px;}
.item-row{display:block;padding:12px 0;border-bottom:1px dashed var(--line);}
.item-row-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.item-row-top textarea{flex:1;min-height:46px;font-size:13px;padding:8px 10px;}
.item-row-fields{display:grid;grid-template-columns:90px 60px 80px 90px 80px 80px 1fr;gap:8px;align-items:end;}
.item-row label{font-size:9.5px;}
.item-row input,.item-row select{padding:6px 7px;font-size:12px;}
.item-num{font-size:11px;color:var(--muted-2);font-weight:700;padding-top:9px;flex:none;width:26px;}
.item-actions{display:flex;gap:4px;justify-content:flex-end;align-items:flex-end;}
.mini-btn{width:24px;height:22px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-size:11px;color:var(--muted);}
.mini-btn:hover{background:#f0f1f0;}
.tax-toggle{display:flex;gap:8px;}
.tax-opt{flex:1;padding:9px;border:1px solid var(--line);border-radius:9px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);transition:.15s;}
.tax-opt:hover{border-color:#c7ced2;}
.tax-opt.sel{background:#fff;color:var(--accent-ink);border-color:var(--accent);box-shadow:0 1px 3px rgba(59,130,199,.18);}

/* ---- A4 Preview ---- */
.preview-shell{position:sticky;top:14px;}
.preview-tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;}
.a4-wrap{background:#DCE1E3;background-image:linear-gradient(180deg,#E3E7E8,#D7DCDE);border-radius:14px;padding:20px;overflow:auto;max-height:calc(100vh - 150px);box-shadow:inset 0 1px 3px rgba(15,27,42,.08);}
.a4{width:210mm;min-height:297mm;background:#fff;margin:0 auto;padding:8mm 9mm;box-shadow:0 6px 24px rgba(0,0,0,.18);font-family:Arial,Helvetica,sans-serif;color:#000;font-size:11px;transform-origin:top center;}

/* ===== Shared doc bits ===== */
.doc-logo-mark{width:64px;height:64px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;box-shadow:0 0 0 1px #ddd;}
.doc-logo-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.orange{color:#000;}
.doc-co-name-big{font-size:30px;font-weight:800;letter-spacing:.01em;font-family:Arial,Helvetica,sans-serif;color:#000;}

/* ===== INVOICE (bordered frame, matches real Tax Invoice) ===== */
table.inv-frame{width:100%;border-collapse:collapse;border:1.4px solid #000;}
table.inv-frame > tbody > tr > td{border:1.1px solid #000;vertical-align:top;padding:6px 8px;}
.inv-header-cell{padding:8px 10px !important;}
.inv-header-row{display:flex;justify-content:space-between;align-items:flex-start;}
.inv-header-left{display:flex;align-items:center;gap:12px;}
.inv-header-right{text-align:right;font-size:11px;font-weight:700;}
.inv-address-line{text-align:center;font-size:10.5px;margin-top:4px;}
.inv-title-cell{text-align:center;font-weight:700;font-size:13px;padding:5px !important;}
.inv-block-head{font-weight:700;text-align:center;font-size:11px;border-bottom:1.1px solid #000;margin:-6px -8px 6px;padding:4px 8px;}
.inv-block-head.right{text-align:right;}
.meta-table{width:100%;border-collapse:collapse;font-size:10.5px;}
.meta-table td{border:none;padding:2px 0;}
.meta-table td.mlabel{width:44%;font-weight:400;}
.cust-body b{font-size:11.5px;}
.cust-body{font-size:10.5px;line-height:1.55;}
table.items-table{width:100%;border-collapse:collapse;font-size:10px;}
table.items-table th,table.items-table td{border:1.1px solid #000;padding:4px 5px;}
table.items-table th{font-size:9px;text-align:center;font-weight:700;}
table.items-table td.num{text-align:right;}
table.items-table td.ctr{text-align:center;}
table.items-table tr.filler td{border-top:none;}
table.tot-mini{width:100%;border-collapse:collapse;}
table.tot-mini td{border:none;padding:2px 0;font-size:10.5px;}
table.tot-mini td.tv{text-align:right;font-weight:400;}
table.tot-mini tr.final td{border-top:1.1px solid #000;padding-top:4px;font-weight:700;}
.words-cell{width:52%;vertical-align:middle !important;font-size:10.5px;padding-right:10px !important;}
.cert-cell{text-align:right;font-size:9.5px;font-style:italic;padding:4px 8px !important;}
.bank-cell{width:52%;font-size:10.5px;line-height:1.6;}
.sign-cell{text-align:center;font-size:10.5px;}
.sign-space{height:46px;display:flex;align-items:center;justify-content:center;}
.sign-img{max-height:44px;max-width:130px;object-fit:contain;display:block;}
.foot-note{font-size:9px;}
.foot-sign{text-align:center;font-weight:700;font-size:10.5px;}
.thanks-line{text-align:center;margin-top:22px;font-size:10.5px;}

/* ===== QUOTATION (plain, only item table bordered) ===== */
.q-header-row{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px;}
.q-header-left{display:flex;align-items:center;gap:12px;}
.q-header-right{text-align:right;font-size:10.5px;line-height:1.7;}
.q-address-line{text-align:center;font-size:10px;margin:6px 0 14px;}
.q-title{text-align:center;font-weight:700;font-size:15px;letter-spacing:.04em;margin-bottom:14px;}
.q-datebox{text-align:right;font-size:10.5px;line-height:1.8;margin-bottom:10px;}
.q-to{font-size:11px;line-height:1.9;margin-bottom:14px;}
table.q-items{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:10px;}
table.q-items th{border:1.1px solid #000;background:#F1F1F1;padding:6px;font-size:9.5px;text-transform:uppercase;}
table.q-items td{border:1.1px solid #000;padding:6px;vertical-align:top;}
table.q-items td.num{text-align:right;}
table.q-items td.ctr{text-align:center;}
.q-words{margin-bottom:14px;font-size:11px;}
.q-terms{font-size:10.5px;line-height:1.85;margin-bottom:16px;}
.q-terms u{text-decoration:underline;}
.q-footer-grid{display:flex;justify-content:space-between;gap:20px;font-size:10px;line-height:1.7;margin-bottom:14px;}
.q-thanks{font-size:11px;margin-bottom:26px;}
.q-sign{text-align:right;font-size:10.5px;line-height:1.6;}
.q-sign .sign-img{display:block;margin:2px 0 2px auto;max-height:42px;max-width:130px;object-fit:contain;}

/* ---- Modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(15,27,42,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.35);}
.modal-head{padding:19px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.close-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:7px;}
.close-x:hover{background:#f0f1f0;}

/* ---- Toast ---- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--ink);border-color:var(--accent);}


/* mobile editor tabs */
.mobile-etabs{display:none;gap:8px;margin-bottom:14px;}
.mobile-etabs button{flex:1;}

@media(max-width:1080px){
  .editor-grid{grid-template-columns:1fr;}
  .preview-shell{position:relative;top:0;}
  .hero-cards{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:760px){
  .sidebar{transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .view{padding:18px 14px 60px;}
  .topbar{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));}
  .grid2,.grid3{grid-template-columns:1fr;}
  .item-row{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;}
  .item-row-fields{grid-template-columns:1fr 1fr;}
  .item-actions{grid-column:1/-1;flex-direction:row;justify-content:flex-end;}
  .stat-row{grid-template-columns:1fr 1fr;}
  .doc-footer-grid{grid-template-columns:1fr;}
}

/* ---- Icons ---- */
.icon{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;}
.nav-ic{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:#9AA7B8;}
.nav-ic .icon{width:17px;height:17px;}
.nav-btn.active .nav-ic{color:var(--accent-2);}
.nav-lock{margin-left:auto;width:13px;height:13px;opacity:.55;flex:none;}
.hc-ic .icon{width:34px;height:34px;stroke-width:1.4;}
.u-ic .icon,.e-ic .icon{width:30px;height:30px;stroke-width:1.3;color:var(--muted-2);margin:0 auto;}
.icon-btn .icon{width:15px;height:15px;}
.btn .icon{width:14px;height:14px;}
.mini-btn .icon{width:12px;height:12px;}

/* ---- Type badges ---- */
.type-badge{display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px 3.5px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.type-badge.quotation{background:#EAF1F9;color:var(--steel);}
.type-badge.invoice{background:#FBF2E6;color:var(--accent-ink);}
.type-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}

/* ---- Reports ---- */
.report-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.report-summary .stat .val{font-size:25px;}
.filter-bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.filter-bar .field{margin-bottom:0;min-width:150px;flex:1;}
.filter-bar .field.grow-search{flex:1.6;min-width:200px;}
.filter-bar label{font-size:10px;}
.filter-daterange{display:none;gap:8px;width:100%;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.filter-daterange.show{display:flex;}
.filter-daterange .field{flex:1;}
.report-mobile-cards{display:none;flex-direction:column;gap:10px;}
.report-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper);}
.report-card .rc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.report-card .rc-doc{font-family:'IBM Plex Mono';font-size:12.5px;font-weight:600;}
.report-card .rc-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px;}
.report-card .rc-amt{font-weight:700;color:var(--text);font-family:'Space Grotesk';}
.report-card .rc-actions{display:flex;gap:6px;margin-top:12px;justify-content:flex-end;}
@media(max-width:900px){
  .report-summary{grid-template-columns:1fr 1fr;}
  #reportTableCard{display:none;}
  .report-mobile-cards{display:flex;}
}

/* ---- Empty state ---- */
.empty{padding:56px 20px;text-align:center;color:var(--muted);}
.empty .e-ic{width:52px;height:52px;border-radius:50%;background:#F1F2F2;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.empty h4{font-size:14.5px;color:var(--text);margin-bottom:6px;}
.empty p{font-size:12.5px;margin:0 0 14px;}

/* ---- Security / PIN ---- */
.sec-overlay{position:fixed;inset:0;background:linear-gradient(160deg,var(--ink-3),var(--accent) 60%,var(--accent-2));display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
.sec-card{background:#fff;border-radius:18px;max-width:400px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;}
.sec-card-head{background:linear-gradient(160deg,var(--ink),var(--ink-3));padding:32px 28px 24px;text-align:center;color:#fff;}
.sec-logo{width:56px;height:56px;border-radius:50%;overflow:hidden;margin:0 auto 12px;box-shadow:0 0 0 3px rgba(214,162,76,.35);}
.sec-logo img{width:100%;height:100%;object-fit:cover;display:block;}
.sec-card-head .sec-brand{font-family:'Space Grotesk';font-weight:700;font-size:16px;letter-spacing:-.01em;}
.sec-card-head .sec-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);font-weight:600;margin-top:2px;}
.sec-card-body{padding:26px 28px 30px;text-align:center;}
.sec-title{font-family:'Space Grotesk';font-size:16.5px;font-weight:700;margin-bottom:5px;}
.sec-desc{font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.pin-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px;}
.pin-boxes{display:flex;gap:10px;justify-content:center;margin-bottom:18px;}
.pin-box{width:46px;height:52px;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-size:22px;font-weight:700;font-family:'Space Grotesk';outline:none;transition:border-color .15s,box-shadow .15s;}
.pin-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,132,46,.16);}
.pin-error{color:var(--bad);font-size:12px;font-weight:600;margin:-8px 0 14px;min-height:15px;}
.sec-card-body .btn{width:100%;justify-content:center;padding:11px;}
.sec-foot-link{margin-top:14px;font-size:11.5px;color:var(--muted-2);cursor:pointer;text-decoration:underline;}
.sec-limit-note{font-size:10.5px;color:var(--muted-2);margin-top:16px;line-height:1.5;}

/* ---- Settings security card ---- */
.pin-dots-display{font-family:'Space Grotesk';font-size:20px;letter-spacing:6px;font-weight:700;color:var(--text);margin:6px 0 16px;}
</style>
</head>

/* ============================= OPTIONAL: PDF AUTO-SAVE FOLDER ============================= */
// Uses the browser's File System Access API (Chrome/Edge, secure contexts only) to let the
// user pick a folder once; after that, downloads write straight into it with no save dialog.
// Falls back to a normal browser download everywhere this isn't available.
const IDB_NAME = 'a1techFiles', IDB_STORE = 'handles', PDF_DIR_KEY = 'pdfAutoSaveDir';
let pdfSaveDirHandle = null;
function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
function pdfAutoSaveSupported(){
  return typeof window.showDirectoryPicker === 'function' && window.isSecureContext;
}
async function choosePdfAutoSaveFolder(){
  if(!pdfAutoSaveSupported()){ toast('Folder auto-save needs Chrome/Edge on HTTPS or localhost.'); return; }
  try{
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await idbSet(PDF_DIR_KEY, handle);
    pdfSaveDirHandle = handle;
    toast(`Auto-save folder set: ${handle.name}`);
    if(state.view==='settings') render();
  }catch(e){ /* user cancelled the picker — do nothing */ }
}
async function clearPdfAutoSaveFolder(){
  try{ await idbDel(PDF_DIR_KEY); }catch(e){}
  pdfSaveDirHandle = null;
  toast('Auto-save folder turned off');
  if(state.view==='settings') render();
}
async function getPdfAutoSaveFolder(){
  if(pdfSaveDirHandle) return pdfSaveDirHandle;
  if(!pdfAutoSaveSupported()) return null;
  try{
    const handle = await idbGet(PDF_DIR_KEY);
    if(!handle) return null;
    pdfSaveDirHandle = handle;
    return handle;
  }catch(e){ return null; }
}
async function ensureDirPermission(handle){
  const opts = { mode: 'readwrite' };
  try{
    if((await handle.queryPermission(opts)) === 'granted') return true;
    if((await handle.requestPermission(opts)) === 'granted') return true;
  }catch(e){}
  return false;
}
// Writes the PDF straight into the chosen folder (no dialog) when configured & permitted,
// otherwise falls back to a normal browser download.
async function deliverPdf(pdf, filename){
  const dir = await getPdfAutoSaveFolder();
  if(dir){
    try{
      const ok = await ensureDirPermission(dir);
      if(ok){
        const fileHandle = await dir.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(pdf.output('blob'));
        await writable.close();
        toast(`Saved to folder: ${filename}`);
        return true;
      }
    }catch(e){ /* fall through to normal download */ }
  }
  pdf.save(filename);
  return false;
}

function hasPin(){ return !!localStorage.getItem(LS.pin); }
function getPinHash(){ return localStorage.getItem(LS.pin); }
function pinHash(pin){ let h=0; for(let i=0;i<pin.length;i++){ h=(h*31 + pin.charCodeAt(i)) >>> 0; } return 'p'+h.toString(36); }
function setPin(pin){ localStorage.setItem(LS.pin, pinHash(pin)); }
function checkPin(pin){ return hasPin() && pinHash(pin)===getPinHash(); }

function wirePinBoxes(containerSel, onComplete){
  const boxes = document.querySelectorAll(containerSel+' .pin-box');
  boxes.forEach((b,i)=>{
    b.oninput = ()=>{
      b.value = b.value.replace(/[^0-9]/g,'').slice(0,1);
      if(b.value && boxes[i+1]) boxes[i+1].focus();
      const val = Array.from(boxes).map(x=>x.value).join('');
      if(val.length===4 && onComplete) onComplete(val);
    };
    b.onkeydown = (e)=>{
      if(e.key==='Backspace' && !b.value && boxes[i-1]){ boxes[i-1].focus(); }
      if(e.key==='Enter'){
        e.preventDefault();
        const btn = document.getElementById('createPinBtn') || document.getElementById('verifyPinBtn') || document.getElementById('chgPinSave');
        if(btn) btn.click();
      }
    };
  });
  if(boxes[0]) setTimeout(()=>boxes[0].focus(),50);
}
function pinBoxesValue(containerSel){
  return Array.from(document.querySelectorAll(containerSel+' .pin-box')).map(x=>x.value).join('');
}
function clearPinBoxes(containerSel){
  document.querySelectorAll(containerSel+' .pin-box').forEach(b=>b.value='');
  const first = document.querySelector(containerSel+' .pin-box'); if(first) first.focus();
}

function financialYear(dateStr){

}

/* --- Indian currency number to words --- */
const ONES=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function twoDigits(n){ if(n<20) return ONES[n]; return TENS[Math.floor(n/10)] + (n%10? " "+ONES[n%10] : ""); }
function threeDigits(n){ let s=""; if(n>=100){ s+=ONES[Math.floor(n/100)]+" Hundred"; n=n%100; if(n) s+=" "; } if(n) s+=twoDigits(n); return s; }
function numToWordsIndian(num){
  num = Math.round(num);
  if(num===0) return "Zero";
  let crore=Math.floor(num/10000000); num%=10000000;
  let lakh=Math.floor(num/100000); num%=100000;
  let thousand=Math.floor(num/1000); num%=1000;
  let rest=num;
  let parts=[];
  if(crore) parts.push(threeDigits(crore)+" Crore");
  if(lakh) parts.push(threeDigits(lakh)+" Lakh");
  if(thousand) parts.push(threeDigits(thousand)+" Thousand");
  if(rest) parts.push(threeDigits(rest));
  return parts.join(" ");
}
function amountInWords(total){
  const rupees = Math.floor(total);
  const paise = Math.round((total-rupees)*100);
  let out = numToWordsIndian(rupees) + " Rupees";
  if(paise>0) out += " and " + numToWordsIndian(paise) + " Paise";
  return out + " Only";
}

/* --- GST / item calc --- */
function calcItem(it){
  const qty = Number(it.qty)||0, rate=Number(it.rate)||0, disc=Number(it.discount)||0, gst=Number(it.gstRate)||0;
  const taxable = Math.max(0, qty*rate - disc);
  const tax = taxable * gst/100;
  return { taxable, tax, total: taxable+tax };
}
function calcDoc(doc){
  let taxable=0, cgst=0, sgst=0, igst=0;
  (doc.items||[]).forEach(it=>{
    const c = calcItem(it);
    taxable += c.taxable;
    if(doc.taxType==="cgst_sgst"){ cgst += c.tax/2; sgst += c.tax/2; }
    else if(doc.taxType==="igst"){ igst += c.tax; }
    // 'none' -> no tax added
  });
  const totalTax = cgst+sgst+igst;
  const grand = taxable+totalTax;
  return { taxable, cgst, sgst, igst, totalTax, grand };
}

  else if(state.view==='invoice-list') { root.innerHTML = renderDocList('invoice'); }
  else if(state.view==='reports') { root.innerHTML = renderReports(); }
  else if(state.view==='customers') { root.innerHTML = renderCustomers(); }
  else if(state.view==='settings') { root.innerHTML = renderSettings(); }
  else if(state.view==='editor') { root.innerHTML = renderEditor(); }

  document.getElementById('ic-lock1').innerHTML = sessionUnlocked ? '' : ICONS.lock;
  document.getElementById('ic-lock2').innerHTML = sessionUnlocked ? '' : ICONS.lock;
  ['dashboard','quotation-list','invoice-list','reports','customers','settings'].forEach(v=>{
    const key = v==='quotation-list'?'quotation': v==='invoice-list'?'invoice': v;
    const el = document.getElementById('ic-'+v);
    if(el) el.innerHTML = ICONS[key] || ICONS.dashboard;
  });

  if(state.view==='editor'){
    topActions.innerHTML = `
      <button class="btn" id="backToList">← Back to list</button>
      <button class="btn btn-accent" id="btnGenerate">${state.editing.status==='generated'?'Re-Generate':'Generate Document'}</button>
    `;
  }
  wireView();
}

/* ---------------- REPORTS ---------------- */
function allDocsForReports(){
  return [...state.quotations.map(d=>({...d,type:'quotation'})), ...state.invoices.map(d=>({...d,type:'invoice'}))];
}
function getCompanyOptions(){
  const set = new Set();
  if(state.profile && state.profile.name) set.add(state.profile.name);
  return Array.from(set);
}
function reportDateFilter(list, dateOpt, from, to){
  if(!dateOpt || dateOpt==='all') return list;
  const now = new Date(); now.setHours(0,0,0,0);
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate()-now.getDay());
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  return list.filter(d=>{
    if(!d.docDate) return false;
    const dt = new Date(d.docDate+"T00:00:00");
    if(dateOpt==='today') return dt.getTime()===now.getTime();
    if(dateOpt==='week') return dt>=startOfWeek;
    if(dateOpt==='month') return dt>=startOfMonth;
    if(dateOpt==='custom'){
      if(from && dt < new Date(from+"T00:00:00")) return false;
      if(to && dt > new Date(to+"T00:00:00")) return false;
      return true;
    }
    return true;
  });
}
function applyReportFilters(){
  const f = state.reportFilters;
  let list = allDocsForReports();
  if(f.type) list = list.filter(d=>d.type===f.type);
  if(f.company) list = list.filter(d=> (state.profile.name||'')===f.company);
  list = reportDateFilter(list, f.date, f.from, f.to);
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(d=> (d.docNo||'').toLowerCase().includes(q) || (d.customer?.name||'').toLowerCase().includes(q) || (state.profile.name||'').toLowerCase().includes(q));
  }
  list.sort((a,b)=>{
    const da=a.docDate||'', db=b.docDate||'';
    if(da!==db) return da<db?1:-1;
    return (b.createdAt||0)-(a.createdAt||0);
  });
  return list;
}
function renderReports(){
  const all = allDocsForReports();
  const now = new Date();
  const thisMonth = all.filter(d=>{ if(!d.docDate) return false; const dt=new Date(d.docDate+"T00:00:00"); return dt.getFullYear()===now.getFullYear() && dt.getMonth()===now.getMonth(); }).length;
  const companies = getCompanyOptions();
  const f = state.reportFilters;
  return `
  <div class="report-summary">
    <div class="card stat"><div class="lbl">Total Documents</div><div class="val">${all.length}</div></div>
    <div class="card stat"><div class="lbl">Total Quotations</div><div class="val">${state.quotations.length}</div></div>
    <div class="card stat"><div class="lbl">Total Invoices</div><div class="val">${state.invoices.length}</div></div>
    <div class="card stat"><div class="lbl">This Month</div><div class="val">${thisMonth}</div></div>
  </div>
  <div class="filter-bar">
    <div class="field"><label>Document Type</label>
      <select id="rfType">
        <option value="">All</option>
        <option value="quotation" ${f.type==='quotation'?'selected':''}>Quotations</option>
        <option value="invoice" ${f.type==='invoice'?'selected':''}>Invoices</option>
      </select>
    </div>
    <div class="field"><label>Company</label>
      <select id="rfCompany">
        <option value="">All</option>
        ${companies.map(c=>`<option value="${escapeHtml(c)}" ${f.company===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Date</label>
      <select id="rfDate">
        <option value="">All Dates</option>
        <option value="today" ${f.date==='today'?'selected':''}>Today</option>
        <option value="week" ${f.date==='week'?'selected':''}>This Week</option>
        <option value="month" ${f.date==='month'?'selected':''}>This Month</option>
        <option value="custom" ${f.date==='custom'?'selected':''}>Custom Date Range</option>
      </select>
    </div>
    <div class="field grow-search"><label>Search</label><input type="text" id="rfSearch" placeholder="Document number, customer, company..." value="${escapeHtml(f.q)}"></div>
    <button class="btn" id="rfClear">${ICONS.filter} Clear Filters</button>
    <div class="filter-daterange ${f.date==='custom'?'show':''}" id="rfDateRange">
      <div class="field"><label>From Date</label><input type="date" id="rfFrom" value="${f.from||''}"></div>
      <div class="field"><label>To Date</label><input type="date" id="rfTo" value="${f.to||''}"></div>
    </div>
  </div>
  <div class="card" id="reportTableCard"><div id="reportTableWrap"></div></div>
  <div class="report-mobile-cards" id="reportCardsWrap"></div>`;
}
function reportRowActions(d){

  if(!list.length) return reportEmptyHtml();
  return `<table><thead><tr><th>Date</th><th>Type</th><th>Document No.</th><th>Company</th><th>Customer</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>

    <td>${reportRowActions(d)}</td>

  if(!list.length) return reportEmptyHtml();
  return list.map(d=>{ const c=calcDoc(d); return `<div class="report-card">
    <div class="rc-top"><span class="type-badge ${d.type}"><span class="dot"></span>${d.type==='invoice'?'Invoice':'Quotation'}</span><span class="badge ${d.status}">${d.status==='generated'?'Generated':'Draft'}</span></div>

    <div class="rc-actions">${reportRowActions(d)}</div>
  </div>`; }).join('');

function reportRefresh(){
  const list = applyReportFilters();
  document.getElementById('reportTableWrap').innerHTML = reportTableHtml(list);
  document.getElementById('reportCardsWrap').innerHTML = reportCardsHtml(list);
  wireReportRowActions();
}
function wireReportRowActions(){
  document.querySelectorAll('[data-rview]').forEach(el=> el.onclick = ()=>{ const [t,id]=el.dataset.rview.split(':'); openReportPreview(t,id); });
  document.querySelectorAll('[data-redit]').forEach(el=> el.onclick = ()=>{ const [t,id]=el.dataset.redit.split(':'); openDoc(t,id); });
  document.querySelectorAll('[data-rpdf]').forEach(el=> el.onclick = ()=>{ const [t,id]=el.dataset.rpdf.split(':'); reportDownloadPdf(t,id); });
  document.querySelectorAll('[data-rdel]').forEach(el=> el.onclick = ()=>{ const [t,id]=el.dataset.rdel.split(':'); confirmAndDelete(t,id, reportRefresh); });
  const clearEmptyBtn = document.getElementById('rfClearEmpty');
  if(clearEmptyBtn) clearEmptyBtn.onclick = clearReportFilters;
}
function clearReportFilters(){ state.reportFilters = { type:"", company:"", date:"", from:"", to:"", q:"" }; render(); }
function wireReports(){
  document.getElementById('rfType').onchange = (e)=>{ state.reportFilters.type=e.target.value; reportRefresh(); };
  document.getElementById('rfCompany').onchange = (e)=>{ state.reportFilters.company=e.target.value; reportRefresh(); };
  document.getElementById('rfDate').onchange = (e)=>{ state.reportFilters.date=e.target.value; document.getElementById('rfDateRange').classList.toggle('show', e.target.value==='custom'); reportRefresh(); };
  document.getElementById('rfFrom').onchange = (e)=>{ state.reportFilters.from=e.target.value; reportRefresh(); };
  document.getElementById('rfTo').onchange = (e)=>{ state.reportFilters.to=e.target.value; reportRefresh(); };
  document.getElementById('rfSearch').oninput = (e)=>{ state.reportFilters.q=e.target.value; reportRefresh(); };
  document.getElementById('rfClear').onclick = clearReportFilters;
  reportRefresh();
}
function openReportPreview(type,id){
  const listKey = type==='invoice'?'invoices':'quotations';
  const doc = state[listKey].find(d=>d.id===id); if(!doc) return;
  // Read-only: shows the final generated document as an in-page popup.
  // No editing form, no application sidebar, no Generate button, no new tab/window.
  showFinalDocumentModal(doc);
}
function reportDownloadPdf(type,id){
  const listKey = type==='invoice'?'invoices':'quotations';
  const doc = state[listKey].find(d=>d.id===id); if(!doc) return;
  toast('Building PDF...');
  downloadPdfForDoc(doc);
}

        <div class="section-title">Security</div>
        <p style="font-size:13px;color:var(--muted);margin-top:0">Protect access to reports, settings and document deletion.</p>

        <button class="btn btn-primary" id="changePinBtn">${ICONS.lock} Change PIN</button>

      </div>
    </div>
  </div>`;
}

/* ---------------- DOCUMENT EDITOR ---------------- */
function blankDoc(type){
  const dateStr = todayISO();
  const nn = nextDocNumber(type, dateStr);
  const base = {
    id: uid(), type, status:'draft',
    docNo: nn.number, _seq: nn.seq, docDate: dateStr,
    customer: { name:"", contact:"", address:"", gstin:"", phone:"", email:"" },
    items: [ { id:uid(), description:"", hsn:"", qty:1, unit:"Nos", rate:0, discount:0, gstRate: state.settings.defaultGstRate } ],
    taxType: state.settings.defaultTaxType,
    terms: "1. Prices are subject to change without prior notice.\n2. Goods once sold will not be taken back.",
    paymentTerms: "100% advance along with PO.",
    notes: "",
    amountWordsOverride: "",
    uploadedFile: null,
    createdAt: Date.now(), updatedAt: Date.now()
  };
  if(type==='invoice') Object.assign(base, { poNo:"", poDate:"", ewayBill:"", vehicleNo:"" });
  return base;
}
function startNewDoc(type){
  const doc = blankDoc(type);
  commitCounter(type);
  markSaving();
  setView('editor', { doc });
}
function openDoc(type, id){
  const listKey = type==='invoice'?'invoices':'quotations';
  const doc = state[listKey].find(d=>d.id===id);
  if(doc) setView('editor', { doc: JSON.parse(JSON.stringify(doc)) });
}
function saveEditingDoc(showToast){
  if(!state.editing) return;
  state.editing.updatedAt = Date.now();
  const listKey = state.editing.type==='invoice'?'invoices':'quotations';
  const idx = state[listKey].findIndex(d=>d.id===state.editing.id);
  const copy = JSON.parse(JSON.stringify(state.editing));
  if(idx===-1) state[listKey].push(copy); else state[listKey][idx]=copy;
  markSaving();
  if(showToast) toast('Document saved');
}

function renderEditor(){
  const d = state.editing;
  if(!d) return `<div class="empty">No document selected.</div>`;
  const isInvoice = d.type==='invoice';
  const totals = calcDoc(d);
  return `
  <div class="mobile-etabs">
    <button class="btn ${state.editMobileTab==='form'?'btn-primary':''}" data-etab="form">Editor</button>
    <button class="btn ${state.editMobileTab==='preview'?'btn-primary':''}" data-etab="preview">Preview</button>
  </div>
  <div class="editor-grid">
    <div class="editor-form" style="${window.innerWidth<=1080 && state.editMobileTab!=='form' ? 'display:none':''}">

      <div class="card card-pad">
        <div class="section-title">${isInvoice?'Invoice':'Quote'} Details</div>
        <div class="grid2">
          <div class="field"><label>${isInvoice?'Invoice':'Quote'} Number</label><input type="text" id="f_docNo" value="${escapeHtml(d.docNo)}"></div>
          <div class="field"><label>${isInvoice?'Invoice':'Quote'} Date</label><input type="date" id="f_docDate" value="${d.docDate}"></div>
        </div>
        ${isInvoice?`
        <div class="grid2">
          <div class="field"><label>PO Number</label><input type="text" id="f_poNo" value="${escapeHtml(d.poNo||'')}" placeholder="Not Detected"></div>
          <div class="field"><label>PO Date</label><input type="date" id="f_poDate" value="${d.poDate||''}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>E-Way Bill Number</label><input type="text" id="f_ewayBill" value="${escapeHtml(d.ewayBill||'')}" placeholder="Not Detected"></div>
          <div class="field"><label>Vehicle Number</label><input type="text" id="f_vehicleNo" value="${escapeHtml(d.vehicleNo||'')}" placeholder="Not Detected"></div>
        </div>`:''}
      </div>

      <div class="card card-pad">
        <div class="section-title">Customer</div>
        <div class="field"><label>Select Existing Customer</label>
          <select id="f_custSelect"><option value="">— Select or type new below —</option>
            ${state.customers.map(c=>`<option value="${c.id}" ${d.customer._id===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Customer / Company Name</label><input type="text" id="f_custName" value="${escapeHtml(d.customer.name)}" placeholder="Not Detected"></div>
        ${!isInvoice?`<div class="field"><label>Attention / M/S (optional, quotation only)</label>
          <div style="display:flex;gap:8px">
            <select id="f_custSalutation" style="flex:0 0 90px">
              ${['Mr.','Mrs.','Miss','Ms.'].map(s=>`<option value="${s}" ${(d.customer.salutation||'Mr.')===s?'selected':''}>${s}</option>`).join('')}
            </select>
            <input type="text" id="f_custContact" style="flex:1" value="${escapeHtml(d.customer.contact||'')}" placeholder="e.g. Ashvak">
          </div>
        </div>`:''}
        <div class="field"><label>Address</label><textarea id="f_custAddress" placeholder="Not Detected">${escapeHtml(d.customer.address)}</textarea></div>
        <div class="grid3">
          <div class="field"><label>GSTIN</label><input type="text" id="f_custGstin" value="${escapeHtml(d.customer.gstin)}" placeholder="Not Detected"></div>
          <div class="field"><label>Phone</label><input type="text" id="f_custPhone" value="${escapeHtml(d.customer.phone)}" placeholder="Not Detected"></div>
          <div class="field"><label>Email</label><input type="text" id="f_custEmail" value="${escapeHtml(d.customer.email)}" placeholder="Not Detected"></div>
        </div>
      </div>

      <div class="card card-pad">
        <div class="section-title">Items <span class="n">(${d.items.length})</span></div>
        <div id="itemsWrap">
          ${d.items.map((it,i)=>itemRowHtml(it,i,d.items.length)).join('')}
        </div>
        <button class="btn btn-sm" id="addItemBtn" style="margin-top:10px">+ Add Item</button>
      </div>

      <div class="card card-pad">
        <div class="section-title">Tax</div>
        <div class="tax-toggle">
          <div class="tax-opt ${d.taxType==='cgst_sgst'?'sel':''}" data-tax="cgst_sgst">CGST + SGST</div>
          <div class="tax-opt ${d.taxType==='igst'?'sel':''}" data-tax="igst">IGST</div>
          <div class="tax-opt ${d.taxType==='none'?'sel':''}" data-tax="none">No Tax</div>
        </div>
      </div>

      <div class="card card-pad">
        <div class="section-title">Amount in Words</div>
        <textarea id="f_amtWords" placeholder="${escapeHtml(amountInWords(totals.grand))}">${escapeHtml(d.amountWordsOverride)}</textarea>
        <div style="font-size:11px;color:var(--muted);margin-top:5px">Leave blank to auto-generate from the grand total.</div>
      </div>

      <div class="card card-pad">
        <div class="section-title">Terms &amp; Notes</div>
        <div class="field"><label>Terms &amp; Conditions</label><textarea id="f_terms">${escapeHtml(d.terms)}</textarea></div>
        <div class="field"><label>Payment Terms</label><input type="text" id="f_paymentTerms" value="${escapeHtml(d.paymentTerms)}"></div>
        <div class="field"><label>Notes</label><textarea id="f_notes">${escapeHtml(d.notes)}</textarea></div>
      </div>
    </div>

    <div class="preview-shell" style="${window.innerWidth<=1080 && state.editMobileTab!=='preview' ? 'display:none':''}">
      <div class="preview-tools">
        <button class="btn btn-sm" id="zoomOut">−</button>
        <button class="btn btn-sm" id="zoomIn">+</button>
        <button class="btn btn-sm" id="downloadPng">PNG</button>
        <button class="btn btn-sm" id="downloadJpg">JPG</button>
        <button class="btn btn-sm btn-accent" id="downloadPdf">${ICONS.pdf} PDF</button>
      </div>
      <div class="a4-wrap" id="a4Wrap">
        <div class="a4" id="a4doc" style="transform:scale(1)">${docPreviewHtml(d, totals)}</div>
      </div>
    </div>
  </div>`;
}

function itemRowHtml(it,i,total){
  return `<div class="item-row" data-itemid="${it.id}">
    <div class="item-row-top">
      <div class="item-num">#${i+1}</div>
      <textarea data-ifield="description" placeholder="Item description">${escapeHtml(it.description)}</textarea>
    </div>
    <div class="item-row-fields">
      <div><label>HSN/SAC</label><input type="text" data-ifield="hsn" value="${escapeHtml(it.hsn)}"></div>
      <div><label>Qty</label><input type="number" data-ifield="qty" value="${it.qty}"></div>
      <div><label>Unit</label><input type="text" data-ifield="unit" value="${escapeHtml(it.unit)}"></div>
      <div><label>Rate</label><input type="number" data-ifield="rate" value="${it.rate}"></div>
      <div><label>Disc.</label><input type="number" data-ifield="discount" value="${it.discount}"></div>
      <div><label>GST %</label><input type="number" data-ifield="gstRate" value="${it.gstRate}"></div>
      <div class="item-actions">
        <button class="mini-btn" title="Duplicate" data-idup="${it.id}">${ICONS.dup}</button>
        <button class="mini-btn" title="Up" data-iup="${it.id}" ${i===0?'disabled':''}>&uarr;</button>
        <button class="mini-btn" title="Down" data-idown="${it.id}" ${i===total-1?'disabled':''}>&darr;</button>
        <button class="mini-btn" title="Delete" data-idel="${it.id}" ${total===1?'disabled':''}>${ICONS.x}</button>
      </div>
    </div>
  </div>`;
}

function logoSvg(){
  return `<img src="${A1_LOGO_DATA_URI}" alt="A1 TECH logo" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;">`;
}
function signatureImg(){
  return `<img src="${A1_SIGNATURE_DATA_URI}" alt="Authorized signature" class="sign-img">`;
}

function docPreviewHtml(d, totals){
  const p = state.profile;
  const isInvoice = d.type==='invoice';
  return isInvoice ? invoiceHtml(d, p, totals) : quotationHtml(d, p, totals);
}

function invoiceHtml(d, p, totals){
  const taxCols = d.taxType==='cgst_sgst' ? 2 : d.taxType==='igst' ? 1 : 0;
  const itemRows = (d.items||[]).map((it,i)=>{
    const c = calcItem(it);
    let taxCells = '';
    if(d.taxType==='cgst_sgst') taxCells = `<td class="num">${(it.gstRate/2)||0}%<br>${(c.tax/2).toFixed(2)}</td><td class="num">${(it.gstRate/2)||0}%<br>${(c.tax/2).toFixed(2)}</td>`;
    else if(d.taxType==='igst') taxCells = `<td class="num">${it.gstRate||0}%<br>${c.tax.toFixed(2)}</td>`;
    return `<tr>
      <td class="ctr">${i+1}</td>
      <td>${escapeHtml(it.description)}</td>
      <td class="ctr">${escapeHtml(it.hsn)}</td>
      <td class="ctr">${it.qty}${it.unit?(' '+escapeHtml(it.unit)):''}</td>
      <td class="ctr">${it.discount?it.discount:'-'}</td>
      <td class="num">${Number(it.rate).toLocaleString('en-IN')}</td>
      <td class="num">${c.taxable.toLocaleString('en-IN',{minimumFractionDigits:0})}</td>
      ${taxCells}
      <td class="num">${(d.taxType==='none'?c.taxable:c.total).toLocaleString('en-IN',{minimumFractionDigits:2})}</td>
    </tr>`;
  }).join('');
  const fillerH = Math.max(30, 230 - (d.items||[]).length*38);
  const totQty = (d.items||[]).reduce((s,it)=>s+(Number(it.qty)||0),0);
  const words = d.amountWordsOverride && d.amountWordsOverride.trim() ? d.amountWordsOverride : amountInWords(totals.grand);
  const taxHead = d.taxType==='cgst_sgst' ? `<th colspan="2">CGST</th><th colspan="0" style="display:none"></th>` : '';

  return `<table class="inv-frame"><tbody>
  <tr><td colspan="2" class="inv-header-cell">
    <div class="inv-header-row">
      <div class="inv-header-left">
        <div class="doc-logo-mark">${logoSvg()}</div>
        <div class="doc-co-name-big">${escapeHtml(p.name)}</div>
      </div>
      <div class="inv-header-right">
        <div class="orange">GSTIN: ${escapeHtml(p.gstin)}</div>
        <div class="orange" style="font-style:italic">PH: ${escapeHtml(p.phone)}, Mail: ${escapeHtml(p.email)}</div>
      </div>
    </div>
    <div class="inv-address-line">Address: ${escapeHtml(p.address).replace(/\n/g,' ')}</div>
  </td></tr>

  <tr><td colspan="2" class="inv-title-cell">Tax Invoice</td></tr>

  <tr>
    <td style="width:55%">
      <div class="inv-block-head" style="text-align:left">Customer Detail</div>
      <div class="cust-body">
        <b>M/S. ${escapeHtml(d.customer.name)||'—'}</b><br>
        ${escapeHtml(d.customer.address).replace(/\n/g,'<br>')}<br>
        ${d.customer.gstin?('GSTIN: '+escapeHtml(d.customer.gstin)):''}
      </div>
    </td>
    <td>
      <div class="inv-block-head right">Original (for Recipient)</div>
      <table class="meta-table">
        <tr><td class="mlabel">Invoice No:</td><td><b>${escapeHtml(d.docNo)}</b></td></tr>
        <tr><td class="mlabel">Invoice Date:</td><td>${fmtDate(d.docDate)}</td></tr>
        <tr><td class="mlabel">PO No:</td><td>${escapeHtml(d.poNo)||'-'}</td></tr>
        <tr><td class="mlabel">PO Date:</td><td>${d.poDate?fmtDate(d.poDate):'-'}</td></tr>
        <tr><td class="mlabel">E-Way Bill No:</td><td>${escapeHtml(d.ewayBill)||'-'}</td></tr>
        <tr><td class="mlabel">Vehicle No:</td><td>${escapeHtml(d.vehicleNo)||'-'}</td></tr>
      </table>
    </td>
  </tr>

  <tr><td colspan="2" style="padding:0">
    <table class="items-table"><thead><tr>
      <th rowspan="2" style="width:26px">Sr.<br>No.</th>
      <th rowspan="2">Description</th>
      <th rowspan="2" style="width:60px">HSN/SAC</th>
      <th rowspan="2" style="width:36px">Qty</th>
      <th rowspan="2" style="width:32px">Dis</th>
      <th rowspan="2" style="width:52px">Rate</th>
      <th rowspan="2" style="width:64px">Taxable Value</th>
      ${d.taxType==='cgst_sgst'?'<th colspan="1" style="width:56px">CGST</th><th colspan="1" style="width:56px">SGST</th>':''}
      ${d.taxType==='igst'?'<th colspan="1" style="width:64px">IGST</th>':''}
      <th rowspan="2" style="width:66px">Total</th>
    </tr></thead>
    <tbody>
      ${itemRows}
      <tr class="filler"><td class="ctr" style="height:${fillerH}px"></td><td></td><td></td><td></td><td></td><td></td><td></td>${'<td></td>'.repeat(taxCols)}<td></td></tr>
      <tr><td class="ctr"><b>Total:</b></td><td></td><td></td><td class="ctr"><b>${totQty}</b></td><td></td><td></td><td class="num"><b>${totals.taxable.toLocaleString('en-IN',{minimumFractionDigits:0})}</b></td>
        ${d.taxType==='cgst_sgst'?`<td class="num"><b>${totals.cgst.toFixed(0)}</b></td><td class="num"><b>${totals.sgst.toFixed(0)}</b></td>`:''}
        ${d.taxType==='igst'?`<td class="num"><b>${totals.igst.toFixed(0)}</b></td>`:''}
        <td class="num"><b>${totals.grand.toLocaleString('en-IN',{minimumFractionDigits:2})}</b></td>
      </tr>
    </tbody></table>
  </td></tr>

  <tr><td colspan="2" style="padding:0">
    <table class="tot-mini"><tr>
      <td class="words-cell" rowspan="5">Amount in words:<br><b>${escapeHtml(words)}</b></td>
      <td style="width:34%">Taxable Amount:</td><td class="tv">${totals.taxable.toLocaleString('en-IN',{minimumFractionDigits:2})}</td>
    </tr>
    ${d.taxType==='cgst_sgst'?`<tr><td>Add: CGST</td><td class="tv">${totals.cgst.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr><tr><td>Add: SGST</td><td class="tv">${totals.sgst.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>`:''}
    ${d.taxType==='igst'?`<tr><td>Add: IGST</td><td class="tv">${totals.igst.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr><tr><td>Round Off:</td><td class="tv">0.00</td></tr>`:''}
    ${d.taxType==='none'?`<tr><td>Tax</td><td class="tv">No Tax</td></tr><tr><td></td><td></td></tr>`:''}
    <tr><td>Total Tax:</td><td class="tv">${totals.totalTax.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>
    <tr class="final"><td>Total Amount After Tax:</td><td class="tv">${totals.grand.toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>
    </table>
  </td></tr>

  <tr><td colspan="2" class="cert-cell">Certified that the particulars given above are true and correct.</td></tr>

  <tr>
    <td class="bank-cell">
      <b>Bank Details:</b><br><br>
      Account Name: ${escapeHtml(p.bank.accName)}<br>
      Account No: ${escapeHtml(p.bank.accNo)}<br>
      IFSC: ${escapeHtml(p.bank.ifsc)}<br>
      Branch: ${escapeHtml(p.bank.branch)}
    </td>
    <td class="sign-cell"><b>For ${escapeHtml(p.name)}</b><div class="sign-space"></div></td>
  </tr>
  <tr>
    <td class="foot-note">This is computer generated invoice no signature required.</td>
    <td class="foot-sign">Authorised Signatory</td>
  </tr>
  </tbody></table>
  <div class="thanks-line">Thank You For Your Business</div>`;
}

function quotationHtml(d, p, totals){
  const total = totals.taxable;
  const words = d.amountWordsOverride && d.amountWordsOverride.trim() ? d.amountWordsOverride : amountInWords(total);
  const itemRows = (d.items||[]).map((it,i)=>`<tr>
    <td class="ctr">${i+1}.</td>
    <td>${escapeHtml(it.description).replace(/\n/g,'<br>')}</td>
    <td class="ctr">${it.qty}${it.unit?(' '+escapeHtml(it.unit)):''}</td>
    <td class="num">${Number(it.rate).toLocaleString('en-IN')}</td>
    <td class="num">${(it.qty*it.rate).toLocaleString('en-IN')}</td>
  </tr>`).join('');
  const gstNote = d.taxType==='cgst_sgst' ? `${(state.settings.defaultGstRate/2)}% CGST &amp; ${(state.settings.defaultGstRate/2)}% SGST will be charged extra.`
    : d.taxType==='igst' ? `${state.settings.defaultGstRate}% IGST will be charged extra.` : `No additional tax will be charged.`;

  return `
  <div class="q-header-row">
    <div class="q-header-left"><div class="doc-logo-mark">${logoSvg()}</div><div class="doc-co-name-big" style="font-size:26px">${escapeHtml(p.name)}</div></div>
    <div class="q-header-right">
      <div class="orange">GSTIN: ${escapeHtml(p.gstin)}</div>
      <div>PH: ${escapeHtml(p.phone)}</div>
      <div class="orange">Mail: ${escapeHtml(p.email)}</div>
    </div>
  </div>
  <div class="q-address-line orange">${escapeHtml(p.address).replace(/\n/g,' ')}</div>

  <div class="q-title">QUOTATION</div>
  <div class="q-datebox">Date: ${fmtDate(d.docDate)}<br>Quote No: ${escapeHtml(d.docNo)}</div>

  <div class="q-to">
    To, ${escapeHtml(d.customer.name)||'—'}<br>
    ${d.customer.contact?(escapeHtml(d.customer.salutation||'Mr.')+' '+escapeHtml(d.customer.contact)+'<br>'):''}
    Address: ${escapeHtml(d.customer.address).replace(/\n/g,', ')}<br><br>
    Phone: ${escapeHtml(d.customer.phone)||'-'}<br>
    GSTIN: ${escapeHtml(d.customer.gstin)||''}
  </div>

  <table class="q-items"><thead><tr>
    <th style="width:40px">S.NO</th><th>DESCRIPTION</th><th style="width:60px">QTY</th><th style="width:90px">RATE PER UNIT</th><th style="width:90px">TOTAL COST</th>
  </tr></thead><tbody>
    ${itemRows}
    <tr><td colspan="4" style="text-align:right"><b>TOTAL:</b></td><td class="num"><b>${total.toLocaleString('en-IN',{minimumFractionDigits:0})}</b></td></tr>
  </tbody></table>

  <div class="q-words"><b>Amount In Words:</b> ${escapeHtml(words)}.</div>

  <div class="q-terms">
    <u><b>Terms and conditions</b></u>:<br>
    <b>Taxes:</b> ${gstNote}<br>
    <b>Payment:</b> ${escapeHtml(d.paymentTerms)||'Issue Cheque in the name of A1 TECH.'}<br>
    ${d.terms?escapeHtml(d.terms).replace(/\n/g,'<br>'):''}
    ${d.notes?('<br><b>Notes:</b> '+escapeHtml(d.notes)):''}
  </div>

  <div class="q-footer-grid">
    <div>
      <b>${escapeHtml(p.name)}</b><br>
      PH: ${escapeHtml(p.phone)}<br>
      Mail: ${escapeHtml(p.email)}<br>
      GSTIN: ${escapeHtml(p.gstin)}<br>
      ${escapeHtml(p.address).replace(/\n/g,' ')}
    </div>
    <div style="text-align:right">
      <b>Bank Details:</b><br>
      Account Number: ${escapeHtml(p.bank.accNo)}<br>
      Bank Name: ${escapeHtml(p.bank.name)}<br>
      A/c Holder Name: ${escapeHtml(p.bank.accName)}<br>
      IFSC Code: ${escapeHtml(p.bank.ifsc)}
    </div>
  </div>

  <div class="q-thanks">Thank You for Your Business!</div>
  <div class="q-sign">For <b>A1 TECH</b>${signatureImg()}<br>Authorized Signatory / Proprietor</div>
  `;
}

function refreshPreviewOnly(){
  const d = state.editing; if(!d) return;
  const totals = calcDoc(d);
  document.getElementById('a4doc').innerHTML = docPreviewHtml(d, totals);
  document.getElementById('topCrumb').textContent = d.docNo;
}
function updateEditingField(path, value){
  const d = state.editing;
  const keys = path.split('.');
  let obj = d;
  for(let i=0;i<keys.length-1;i++) obj = obj[keys[i]];
  obj[keys[keys.length-1]] = value;
  saveEditingDoc(false);
  refreshPreviewOnly();
}

function wireView(){
  // sidebar nav
  document.querySelectorAll('.nav-btn').forEach(b=> b.onclick = ()=> setView(b.dataset.view));
  document.getElementById('hamburger').onclick = ()=> document.getElementById('sidebar').classList.toggle('open');

  document.querySelectorAll('[data-newdoc]').forEach(el=> el.onclick = ()=> startNewDoc(el.dataset.newdoc));
  document.querySelectorAll('[data-open]').forEach(el=> el.onclick = ()=>{ const [t,id]=el.dataset.open.split(':'); openDoc(t,id); });
  document.querySelectorAll('[data-dup]').forEach(el=> el.onclick = ()=>{
    const [t,id]=el.dataset.dup.split(':'); const listKey=t==='invoice'?'invoices':'quotations';
    const doc = state[listKey].find(d=>d.id===id); if(!doc) return;
    const copy = JSON.parse(JSON.stringify(doc)); copy.id=uid(); copy.status='draft';
    const nn = nextDocNumber(t, copy.docDate); copy.docNo = nn.number; commitCounter(t);
    copy.createdAt=Date.now(); copy.updatedAt=Date.now();
    state[listKey].push(copy); markSaving(); toast('Document duplicated'); render();
  });
  document.querySelectorAll('[data-del]').forEach(el=> el.onclick = ()=>{
    const [t,id]=el.dataset.del.split(':');
    confirmAndDelete(t,id);
  });

  if(state.view==='quotation-list' || state.view==='invoice-list'){
    const type = state.view==='invoice-list'?'invoice':'quotation';
    const listKey = type==='invoice'?'invoices':'quotations';
    const doFilter = ()=>{
      const q = (document.getElementById('dlSearch').value||'').toLowerCase();
      const st = document.getElementById('dlStatus').value;
      let list = state[listKey].slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      if(q) list = list.filter(d=> (d.docNo||'').toLowerCase().includes(q) || (d.customer?.name||'').toLowerCase().includes(q) || (d.poNo||'').toLowerCase().includes(q));
      if(st) list = list.filter(d=>d.status===st);
      document.getElementById('dlTableWrap').innerHTML = docListTable(list,type);
      document.querySelectorAll('[data-open]').forEach(el=> el.onclick = ()=>{ const [t,id]=el.dataset.open.split(':'); openDoc(t,id); });
      document.querySelectorAll('[data-dup]').forEach(el=> el.onclick = ()=>{
        const [t,id]=el.dataset.dup.split(':'); const lk=t==='invoice'?'invoices':'quotations';
        const doc = state[lk].find(d=>d.id===id); if(!doc) return;
        const copy = JSON.parse(JSON.stringify(doc)); copy.id=uid(); copy.status='draft';
        const nn = nextDocNumber(t, copy.docDate); copy.docNo = nn.number; commitCounter(t);
        copy.createdAt=Date.now(); copy.updatedAt=Date.now();
        state[lk].push(copy); markSaving(); toast('Document duplicated'); render();
      });
      document.querySelectorAll('[data-del]').forEach(el=> el.onclick = ()=>{ const [t,id]=el.dataset.del.split(':'); confirmAndDelete(t,id); });
    };
    document.getElementById('dlSearch').oninput = doFilter;
    document.getElementById('dlStatus').onchange = doFilter;
  }

  if(state.view==='customers'){
    document.getElementById('addCustBtn').onclick = ()=> openCustomerModal(null);
    document.getElementById('custSearch').oninput = (e)=>{
      const q=e.target.value.toLowerCase();
      const list = state.customers.filter(c=> c.name.toLowerCase().includes(q) || (c.gstin||'').toLowerCase().includes(q));
      document.getElementById('custTableWrap').innerHTML = custTable(list);
      wireCustTable();
    };
    wireCustTable();
  }

  if(state.view==='reports') wireReports();
  if(state.view==='settings') wireSettings();
  if(state.view==='editor') wireEditor();
}
function wireCustTable(){
  document.querySelectorAll('[data-custedit]').forEach(el=> el.onclick = ()=> openCustomerModal(el.dataset.custedit));
  document.querySelectorAll('[data-custdel]').forEach(el=> el.onclick = ()=>{
    if(!confirm('Delete this customer?')) return;
    state.customers = state.customers.filter(c=>c.id!==el.dataset.custdel);
    markSaving(); toast('Customer deleted'); render();
  });
}

function wireSettings(){
  document.querySelectorAll('#setTabs .tab').forEach(t=> t.onclick = ()=>{
    document.querySelectorAll('#setTabs .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.settings-panel').forEach(p=> p.style.display = p.dataset.panel===t.dataset.tab ? '' : 'none');
  });
  document.getElementById('saveProfile').onclick = ()=>{
    state.profile = {
      name:document.getElementById('pName').value, address:document.getElementById('pAddress').value,
      phone:document.getElementById('pPhone').value, email:document.getElementById('pEmail').value,
      gstin:document.getElementById('pGstin').value,
      bank:{ name:document.getElementById('bName').value, accName:document.getElementById('bAccName').value,
             accNo:document.getElementById('bAccNo').value, ifsc:document.getElementById('bIfsc').value,
             branch:document.getElementById('bBranch').value }
    };
    markSaving(); toast('Profile saved');
  };
  document.getElementById('saveNumbering').onclick = ()=>{
    state.counters.quotation = { prefix:document.getElementById('qPrefix').value, seq:Number(document.getElementById('qSeq').value)||1, digits:Number(document.getElementById('qDigits').value)||3 };
    state.counters.invoice = { prefix:document.getElementById('iPrefix').value, seq:Number(document.getElementById('iSeq').value)||1, digits:Number(document.getElementById('iDigits').value)||2 };
    markSaving(); toast('Numbering saved'); render();
  };
  document.getElementById('saveGst').onclick = ()=>{
    state.settings.defaultTaxType = document.getElementById('defTaxType').value;
    state.settings.defaultGstRate = Number(document.getElementById('defGstRate').value)||0;
    markSaving(); toast('GST defaults saved');
  };
  document.getElementById('exportBackup').onclick = ()=>{
    const data = { profile:state.profile, customers:state.customers, quotations:state.quotations, invoices:state.invoices, counters:state.counters, settings:state.settings, exportedAt:new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'a1tech-data.json'; a.click();
    toast('Backup exported');
  };
  document.getElementById('importBackupBtn').onclick = ()=> document.getElementById('importBackupFile').click();
  document.getElementById('importBackupFile').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(data.profile) state.profile=data.profile;
        if(data.customers) state.customers=data.customers;
        if(data.quotations) state.quotations=data.quotations;
        if(data.invoices) state.invoices=data.invoices;
        if(data.counters) state.counters=data.counters;
        if(data.settings) state.settings=data.settings;
        markSaving(); toast('Backup imported'); render();
      }catch(err){ toast('Invalid backup file'); }
    };
    reader.readAsText(file);
  };
  document.getElementById('changePinBtn').onclick = openChangePinModal;
  const chooseFolderBtn = document.getElementById('choosePdfFolder');
  if(chooseFolderBtn) chooseFolderBtn.onclick = choosePdfAutoSaveFolder;
  const clearFolderBtn = document.getElementById('clearPdfFolder');
  if(clearFolderBtn) clearFolderBtn.onclick = clearPdfAutoSaveFolder;
  const folderStatusEl = document.getElementById('pdfFolderStatus');
  if(folderStatusEl){
    if(!pdfAutoSaveSupported()){
      folderStatusEl.textContent = 'Not supported in this browser/context — using normal downloads.';
    } else {
      getPdfAutoSaveFolder().then(handle=>{
        const el = document.getElementById('pdfFolderStatus');
        if(!el) return;
        el.textContent = handle ? `Auto-saving PDFs to: ${handle.name}` : 'Not set — PDFs use your normal Downloads folder.';
      });
    }
  }
  document.getElementById('clearAllBtn').onclick = ()=>{
    if(!confirm('This will permanently delete ALL A1 TECH data from this browser (customers, quotations, invoices, templates, settings). Continue?')) return;
    if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
    state.customers=[]; state.quotations=[]; state.invoices=[]; state.counters=JSON.parse(JSON.stringify(DEFAULT_COUNTERS));
    state.profile=JSON.parse(JSON.stringify(DEFAULT_PROFILE)); state.settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    persistAll(); toast('All data cleared'); setView('dashboard');
  };
}

function wireEditor(){
  const d = state.editing;
  document.getElementById('backToList').onclick = ()=> setView(d.type==='invoice'?'invoice-list':'quotation-list');
  document.getElementById('btnGenerate').onclick = ()=> runGenerateWorkflow();
  document.querySelectorAll('[data-etab]').forEach(b=> b.onclick=()=>{ state.editMobileTab=b.dataset.etab; render(); });

  // simple text/date fields
  const bind = (id, path, isNum)=>{ const el=document.getElementById(id); if(!el) return; el.oninput = ()=> updateEditingField(path, isNum? Number(el.value)||0 : el.value); };
  bind('f_docNo','docNo'); bind('f_docDate','docDate');
  bind('f_poNo','poNo'); bind('f_poDate','poDate'); bind('f_ewayBill','ewayBill'); bind('f_vehicleNo','vehicleNo');
  bind('f_custName','customer.name'); bind('f_custContact','customer.contact'); bind('f_custAddress','customer.address'); bind('f_custGstin','customer.gstin');
  bind('f_custPhone','customer.phone'); bind('f_custEmail','customer.email');
  const salSel = document.getElementById('f_custSalutation');
  if(salSel) salSel.onchange = ()=> updateEditingField('customer.salutation', salSel.value);
  bind('f_amtWords','amountWordsOverride'); bind('f_terms','terms'); bind('f_paymentTerms','paymentTerms'); bind('f_notes','notes');

  const sel = document.getElementById('f_custSelect');
  if(sel) sel.onchange = ()=>{
    const c = state.customers.find(x=>x.id===sel.value);
    if(c){ d.customer = { _id:c.id, name:c.name, contact:c.contact, address:c.address, gstin:c.gstin, phone:c.phone, email:c.email }; }
    else { d.customer._id=null; }
    saveEditingDoc(false); render();
  };

  document.querySelectorAll('.tax-opt').forEach(el=> el.onclick = ()=>{ d.taxType = el.dataset.tax; saveEditingDoc(false); render(); });

  // items
  document.getElementById('addItemBtn').onclick = ()=>{
    d.items.push({ id:uid(), description:"", hsn:"", qty:1, unit:"Nos", rate:0, discount:0, gstRate: state.settings.defaultGstRate });
    saveEditingDoc(false); render();
  };
  document.querySelectorAll('.item-row').forEach(row=>{
    const itemId = row.dataset.itemid;
    row.querySelectorAll('[data-ifield]').forEach(inp=>{
      inp.oninput = ()=>{
        const it = d.items.find(x=>x.id===itemId);
        const field = inp.dataset.ifield;
        it[field] = (field==='qty'||field==='rate'||field==='discount'||field==='gstRate') ? Number(inp.value)||0 : inp.value;
        saveEditingDoc(false); refreshPreviewOnly();
      };
    });
  });
  document.querySelectorAll('[data-idup]').forEach(el=> el.onclick = ()=>{
    const it = d.items.find(x=>x.id===el.dataset.idup);
    const idx = d.items.indexOf(it);
    d.items.splice(idx+1,0,{...it,id:uid()});
    saveEditingDoc(false); render();
  });
  document.querySelectorAll('[data-idel]').forEach(el=> el.onclick = ()=>{
    if(d.items.length<=1) return;
    d.items = d.items.filter(x=>x.id!==el.dataset.idel);
    saveEditingDoc(false); render();
  });
  document.querySelectorAll('[data-iup]').forEach(el=> el.onclick = ()=>{
    const idx = d.items.findIndex(x=>x.id===el.dataset.iup);
    if(idx>0){ [d.items[idx-1],d.items[idx]]=[d.items[idx],d.items[idx-1]]; saveEditingDoc(false); render(); }
  });
  document.querySelectorAll('[data-idown]').forEach(el=> el.onclick = ()=>{
    const idx = d.items.findIndex(x=>x.id===el.dataset.idown);
    if(idx<d.items.length-1){ [d.items[idx+1],d.items[idx]]=[d.items[idx],d.items[idx+1]]; saveEditingDoc(false); render(); }
  });

  // zoom
  let scale = 1;
  const a4 = document.getElementById('a4doc');
  document.getElementById('zoomIn').onclick = ()=>{ scale=Math.min(1.3,scale+.1); a4.style.transform=`scale(${scale})`; };
  document.getElementById('zoomOut').onclick = ()=>{ scale=Math.max(.4,scale-.1); a4.style.transform=`scale(${scale})`; };

  // export
  document.getElementById('downloadPng').onclick = ()=> exportImage('png');
  document.getElementById('downloadJpg').onclick = ()=> exportImage('jpeg');
  document.getElementById('downloadPdf').onclick = ()=> exportPdf();
}

/* ============================= GENERATE WORKFLOW HELPERS ============================= */
// The document code (docNo) is the single source of truth for filenames everywhere.
function sanitizeForFilename(s){
  return (s||'').toString().trim().replace(/[\\/:*?"<>|]/g,'-');
}
function pdfFileName(type, docNo){
  const prefix = type==='invoice' ? 'invoice_' : 'quate_';
  return `${prefix}${sanitizeForFilename(docNo)}.pdf`;
}
function validateDocForGeneration(d){
  const errors=[];
  const label = d.type==='invoice'?'Invoice':'Quotation';
  if(!d.docNo || !d.docNo.trim()) errors.push(`${label} Number / Document Code is required.`);
  if(!d.docDate) errors.push('Document date is required.');
  if(!d.customer || !d.customer.name || !d.customer.name.trim()) errors.push('Customer / Company name is required.');
  const validItems = (d.items||[]).filter(it=> (it.description||'').toString().trim());
  if(validItems.length===0) errors.push('At least one item with a description is required.');
  return errors;
}
function showValidationErrors(errors){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="genErrBg"><div class="modal" style="max-width:420px">
    <div class="modal-body" style="padding:30px 26px">
      <div style="font-family:'Space Grotesk';font-size:16px;font-weight:700;margin-bottom:10px;color:var(--bad)">Please complete required fields</div>
      <ul style="margin:0 0 18px;padding-left:18px;font-size:13px;color:var(--text);line-height:1.7">
        ${errors.map(e=>`<li>${escapeHtml(e)}</li>`).join('')}
      </ul>
      <button class="btn btn-primary" id="genErrClose" style="width:100%;justify-content:center">OK</button>
    </div>
  </div></div>`;
  const close = ()=> root.innerHTML='';
  document.getElementById('genErrClose').onclick = close;
  document.getElementById('genErrBg').addEventListener('click',(e)=>{ if(e.target.id==='genErrBg') close(); });
}
// Renders the given doc to an offscreen A4 element and resolves with a jsPDF instance.
function buildPdfForDoc(d){
  return new Promise((resolve)=>{
    const totals = calcDoc(d);
    const wrap = document.createElement('div');
    wrap.style.position='fixed'; wrap.style.left='-9999px'; wrap.style.top='0';
    wrap.innerHTML = `<div class="a4">${docPreviewHtml(d, totals)}</div>`;
    document.body.appendChild(wrap);
    html2canvas(wrap.querySelector('.a4'),{scale:2,useCORS:true}).then(canvas=>{
      document.body.removeChild(wrap);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p','mm','a4');
      const imgW = 210, pageH = 297;
      const imgH = canvas.height * imgW / canvas.width;
      const img = canvas.toDataURL('image/jpeg',0.95);
      const EPS = 3;
      pdf.addImage(img,'JPEG',0,0,imgW,imgH);
      let heightLeft = imgH - pageH, y = 0;
      while(heightLeft > EPS){ y -= pageH; pdf.addPage(); pdf.addImage(img,'JPEG',0,y,imgW,imgH); heightLeft -= pageH; }
      resolve(pdf);
    });
  });
}
function downloadPdfForDoc(d){
  return buildPdfForDoc(d).then(pdf=>{ deliverPdf(pdf, pdfFileName(d.type, d.docNo)); return pdf; });
}

// Full "Generate" pipeline: validate -> save -> show confirmation popup.
// PDF creation is NOT automatic — the person downloads it on demand (popup / Reports / editor
// panel), at which point it either downloads normally or writes straight into an auto-save
// folder if one has been configured in Settings. Nothing opens in a new tab/window — everything
// happens in-page as a popup, and the original app view stays exactly where it was.
let generationInProgress = false;
function runGenerateWorkflow(){
  if(generationInProgress) return; // guards against double-click / duplicate generation
  const d = state.editing;
  if(!d) return;
  const errors = validateDocForGeneration(d);
  if(errors.length){ showValidationErrors(errors); return; }

  generationInProgress = true;
  const btn = document.getElementById('btnGenerate');
  if(btn){ btn.disabled = true; btn.textContent = 'Generating...'; }

  d.status = 'generated';
  d.updatedAt = Date.now();
  saveEditingDoc(false);
  persistAll(); // save to localStorage immediately
  const pill=document.getElementById('savePill'), txt=document.getElementById('saveTxt');
  if(pill && txt){ pill.className='save-pill ok'; txt.textContent='Saved ✓'; }

  render(); // refresh editor (status badge, Re-Generate label, top crumb)
  showGeneratedPopup(d);

  generationInProgress = false;
  const btn2 = document.getElementById('btnGenerate');

function exportImage(fmt){
  const a4 = document.getElementById('a4doc');
  const prevT = a4.style.transform; a4.style.transform='scale(1)';
  toast('Rendering document...');
  html2canvas(a4,{scale:2,useCORS:true}).then(canvas=>{
    a4.style.transform=prevT;
    const link = document.createElement('a');
    link.download = `${state.editing.docNo.replace(/\//g,'-')}.${fmt==='jpeg'?'jpg':'png'}`;
    link.href = canvas.toDataURL(fmt==='jpeg'?'image/jpeg':'image/png', 0.95);
    link.click();
  });
}
function exportPdf(){
  const a4 = document.getElementById('a4doc');
  const prevT = a4.style.transform; a4.style.transform='scale(1)';
  toast('Building PDF...');
  html2canvas(a4,{scale:2,useCORS:true}).then(canvas=>{
    a4.style.transform=prevT;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const imgW = 210, pageH = 297;
    const imgH = canvas.height * imgW / canvas.width;
    const img = canvas.toDataURL('image/jpeg',0.95);
    // Tolerance: ignore trailing slivers caused by sub-pixel/rounding overflow
    // so a normal single-page document never spawns a near-blank extra page.
    const EPS = 3;
    pdf.addImage(img,'JPEG',0,0,imgW,imgH);
    let heightLeft = imgH - pageH;
    let y = 0;
    while(heightLeft > EPS){
      y -= pageH;
      pdf.addPage();
      pdf.addImage(img,'JPEG',0,y,imgW,imgH);
      heightLeft -= pageH;
    }
    deliverPdf(pdf, pdfFileName(state.editing.type, state.editing.docNo));
  });
}

window.addEventListener('resize', ()=>{ if(state.view==='editor') render(); });
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter') return;
  const t = e.target;
  if(!t || t.tagName==='TEXTAREA') return;               // allow newlines in textareas
  if(t.classList && t.classList.contains('pin-box')) return; // handled in wirePinBoxes
  if(t.tagName!=='INPUT' && t.tagName!=='SELECT') return;
  const modal = t.closest('.modal');
  if(modal){
    e.preventDefault();
    const btn = modal.querySelector('.modal-foot .btn-primary, .modal-foot .btn-accent, .modal-foot .btn-danger');
    if(btn){ btn.click(); return; }
  }
  const panel = t.closest('.settings-panel');
  if(panel){
    e.preventDefault();
    const btn = panel.querySelector('.btn-primary, .btn-accent');
    if(btn){ btn.click(); return; }
  }
  if(t.closest('.editor-form')){
    e.preventDefault(); t.blur(); return; // fields auto-save on input; Enter just confirms/leaves field
  }
  // toolbars / filter bars / search fields: filters are already live, Enter just confirms
  e.preventDefault();
  t.blur();
});
